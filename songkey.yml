# Runs the published release image. Nothing is built on the server.
#
# On OpenMediaVault, keep it next to the .env, in a folder with the same name:
#   <appdata>/songkey/songkey.yml
#   <appdata>/songkey/.env
#
# Updating: Services -> Compose -> Files -> select songkey -> Pull, then Up.
# From a shell, the same is:
#   docker compose -f songkey.yml pull && docker compose -f songkey.yml up -d
#
# The service only speaks HTTP to MeTube and Navidrome, so it never mounts the
# music library and cannot touch the files.

services:
  songkey:
    # "0.1" follows every 0.1.x fix but never jumps to 0.2, which may change
    # configuration or replies. Move it by hand after reading the release notes.
    image: ghcr.io/mrt-coder/songkey:0.1
    container_name: songkey
    restart: unless-stopped

    ports:
      - "8090:8090"

    volumes:
      # The catalog must survive container recreation, otherwise the duplicate
      # index is rebuilt from scratch on every update.
      - ./data:/data

    # MeTube and Navidrome publish on the host, so reaching them through the
    # host gateway avoids joining — and risking — their existing networks.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    # A hard ceiling on a machine with under 2 GB of RAM: if anything runs
    # away, the container dies instead of the server.
    #
    # This must cover the service AND the yt-dlp process it spawns. The Go
    # binary sits around 20 MB, but the standalone yt-dlp build unpacks itself
    # into memory and peaks well above 100 MB — at 128m the kernel was killing
    # it mid-probe.
    mem_limit: 256m
